<!doctype html>
<html lang="tr" class="theme-dark dark" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep API DNS warm without opening an early connection Lighthouse may flag as unused. -->
    <link rel="dns-prefetch" href="//api.oyuncukantinim.com.tr" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyuncu Kantinim - Yenilikçi Oyuncu Alışveriş Platformu</title>
    <meta name="description" content="En uygun fiyatli E-Pinler, guvenilir oyuncu pazari ve aninda teslimat garantisi." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ok_theme_mode');
          var theme = stored === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('theme-dark', theme === 'dark');
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          root.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('theme-dark', 'dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
